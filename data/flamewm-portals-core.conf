# which xdg-desktop-portal backends serve flame (XDG_CURRENT_DESKTOP=flamewm)
# without its apps: screen sharing and screenshots from flame itself
# (flamewm.portal) with its own picker, everything else gtk's, open and save
# dialogs too. flame's apps put flamewm-portals.conf in /etc/xdg over it
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=flamewm
org.freedesktop.impl.portal.Screenshot=flamewm
