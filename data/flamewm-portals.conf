# which xdg-desktop-portal backends serve flame (XDG_CURRENT_DESKTOP=flamewm):
# screen sharing, screenshots and open/save dialogs from flame itself
# (flamewm.portal), with its own picker and flamefiles, everything else gtk's
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=flamewm
org.freedesktop.impl.portal.Screenshot=flamewm
org.freedesktop.impl.portal.FileChooser=flamewm
