# which xdg-desktop-portal backends serve flame (XDG_CURRENT_DESKTOP=flamewm):
# screen sharing and screenshots from flame itself (flamewm.portal), with
# its own picker, everything else (file pickers and such) gtk's
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=flamewm
org.freedesktop.impl.portal.Screenshot=flamewm
