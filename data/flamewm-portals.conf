# which xdg-desktop-portal backends serve flame (XDG_CURRENT_DESKTOP=flamewm):
# screen sharing and screenshots from xdg-desktop-portal-wlr, which captures
# through flame's screencopy, everything else (file pickers and such) gtk's
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
